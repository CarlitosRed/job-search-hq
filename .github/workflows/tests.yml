name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install playwright
      - run: python -m playwright install webkit
      - run: python tools/hq-dashboard/port_tracker.py --backend pc
      - run: python -I tools/hq-dashboard/test_ai_tasks.py
      - run: python -I tools/hq-dashboard/test_cv_onepage.py
      - run: python -I tools/hq-dashboard/test_pc_server.py
      - run: python -I tools/hq-dashboard/test_job_search.py
      - run: python -I tools/hq-dashboard/test_lead_policy.py
      - run: python -I tools/hq-dashboard/test_lead_ranker.py
      - run: python -I tools/hq-dashboard/test_link_fetch.py
      - run: node tools/hq-dashboard/test_importance.js
      - run: python -I tools/hq-dashboard/test_profile.py
      - run: python -I tools/hq-dashboard/test_rubric_versions.py
      - run: python -I tools/hq-dashboard/test_data_root.py
      - run: python -I tools/hq-dashboard/test_cv_quality.py
      - run: python -I tools/hq-dashboard/test_cv_fix.py
      - run: python -I tools/hq-dashboard/test_strong_cv.py
      - run: python -I tools/hq-dashboard/test_state_path.py
      - run: python -I tools/hq-dashboard/test_search_profile.py
      - run: python -I tools/hq-dashboard/test_daily_search.py
      - run: python -I tools/hq-dashboard/test_discovery_sources.py
      - run: python -I tools/hq-dashboard/test_ai_shadow.py
      - run: python -I tools/hq-dashboard/test_review_search.py
      - run: python -I tools/hq-dashboard/test_automatic_read_hosts.py
      # Card 03: closing and re-check.
      - run: python -I tools/hq-dashboard/test_board_reads.py
      - run: python -I tools/tracker/test_store.py
      - run: python -I tools/tracker/test_stages.py
      - run: python -I tools/tracker/test_rounds.py
      - run: python -I tools/tracker/test_fresh.py
      - run: python -I tools/tracker/test_archive.py
      - run: python -I tools/tracker/test_age_rollover.py
      - run: python -I tools/tracker/test_migrations.py
      - run: python -I tools/tracker/test_land_search.py
      - run: python -I tools/tracker/test_daily_run.py
      - run: python -I tools/tracker/test_recheck.py
      # Card 04a: qualification judge.
      - run: python -I tools/tracker/test_judge.py

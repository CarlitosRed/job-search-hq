name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install playwright
      - run: python -m playwright install webkit
      - run: python tools/hq-dashboard/port_tracker.py --backend pc
      - run: python -I tools/hq-dashboard/test_ai_tasks.py
      - run: python -I tools/hq-dashboard/test_cv_onepage.py
      - run: python -I tools/hq-dashboard/test_pc_server.py
